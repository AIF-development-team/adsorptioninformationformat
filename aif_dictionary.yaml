id: https://github.com/AIF-development-team/adsorptioninformationformat
name: aif
title: Adsorption Information Format (AIF)
description: >-
  Dictionary for STAR format adsorption experiment and simulation data
  files Reference: Evans et al., Langmuir 2021, 37, 4222-4226.
version: "__AIF_VERSION__"
license: MIT

prefixes:
  aif: https://github.com/AIF-development-team/adsorptioninformationformat/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/

imports:
  - linkml:types

default_range: string

# ──────────────────────────────────────────────
#  Enumerations
# ──────────────────────────────────────────────

enums:

  ExperimentalMethod:
    description: Method used to determine amount adsorbed.
    permissible_values:
      volumetric:
        description: Volumetric (manometric) method.
      gravimetric:
        description: Gravimetric method.
      chromatographic:
        description: 
      simulation:
        description: 
      other:
        description: 
  IsothermType:
    description: Type of adsorption isotherm.
    permissible_values:
      absolute:
        description: Absolute adsorption.
      excess:
        description: Excess adsorption.
      net:
        description: Net adsorption.

# ──────────────────────────────────────────────
#  Slots (data items / fields)
# ──────────────────────────────────────────────

slots:

  # ── Audit ───────────────────────────────────

  audit_aif_version:
    aliases: ["_audit_aif_version"]
    description: Version of the AIF data-name dictionary used by this file
    required: true

  audit_creation_date:
    aliases: ["_audit_creation_date"]
    description: Date and time the AIF file was created in ISO 8601 format
    range: datetime

  audit_creation_software:
    aliases: ["_audit_creation_software"]
    description: Name and version of the software used to generate this AIF file

  audit_digitizer:
    aliases: ["_audit_digitizer"]
    description: Name of the person who digitized the data, if extracted from a published figure or table

  # ── Experimental ────────────────────────────

  exptl_operator:
    aliases: ["_exptl_operator"]
    description: Name of the person who performed the experiment

  exptl_date:
    aliases: ["_exptl_date"]
    description: Date and time of the experiment in ISO 8601 format
    range: datetime

  exptl_instrument:
    aliases: ["_exptl_instrument"]
    description: Identifier or model name of the instrument used for the measurement

  exptl_temperature:
    aliases: ["_exptl_temperature"]
    description: Temperature at which the experiment was conducted (see _units_temperature)
    range: float

  exptl_method:
    aliases: ["_exptl_method"]
    description: Experimental technique used to measure the amount adsorbed
    range: ExperimentalMethod

  exptl_isotherm_type:
    aliases: ["_exptl_isotherm_type"]
    description: Classification of the reported adsorbed amount
    range: IsothermType

  # ── Adsorbent ───────────────────────────────

  adsnt_material_id:
    aliases: ["_adsnt_material_id"]
    description: Name or designation of the adsorbent material, e.g. UiO-66, Zeolite-13X
    required: true

  adsnt_info:
    aliases: ["_adsnt_info"]
    description: Free-text field for additional information about the adsorbent sample

  adsnt_sample_id:
    aliases: ["_adsnt_sample_id"]
    description: Unique sample identifier assigned by the operator or laboratory
    required: true

  adsnt_hashkey:
    aliases: ["_adsnt_hashkey"]
    description: Machine-readable hash key for programmatic identification of the adsorbent

  adsnt_structure_csd_refcode:
    aliases: ["_adsnt_structure_csd_refcode"]
    description: Cambridge Structural Database (CSD) reference code for the adsorbent structure

  adsnt_structure_topology:
    aliases: ["_adsnt_structure_topology"]
    description: Network topology descriptor (e.g. RCSR symbol) for the adsorbent

  adsnt_structure_smiles:
    aliases: ["_adsnt_structure_smiles"]
    description: SMILES of the organic linker or building block of the adsorbent

  adsnt_composition:
    aliases: ["_adsnt_composition"]
    description: Chemical composition or formula of the adsorbent, e.g. Cu3(BTC)2

  adsnt_molar_mass:
    aliases: ["_adsnt_molar_mass"]
    description: Molar mass of the adsorbent formula unit (see _units_molecular_weight)
    range: float

  adsnt_synthesis:
    aliases: ["_adsnt_synthesis"]
    description: Synthesis route or details used, e.g. solvothermal, mechanochemical, reference to MPIF, etc

  adsnt_sample_mass:
    aliases: ["_adsnt_sample_mass"]
    description: Mass of the adsorbent sample used in the measurement (see _units_mass)
    range: float

  adsnt_sample_density:
    aliases: ["_adsnt_sample_density"]
    description: Bulk or skeletal density of the adsorbent sample (see _units_density)
    range: float

  adsnt_degas_summary:
    aliases: ["_adsnt_degas_summary"]
    description: Human-readable summary of the degassing procedure and conditions

  adsnt_degas_temperature:
    aliases: ["_adsnt_degas_temperature"]
    description: Temperature at which the sample was degassed prior to measurement (see _units_temperature)
    range: float

  adsnt_degas_time:
    aliases: ["_adsnt_degas_time"]
    description: Duration of the degassing step (see _units_time)
    range: float

  # ── Adsorptive ──────────────────────────────

  adsorptive_name:
    aliases: ["_adsorptive_name"]
    description: Common name of the adsorptive gas or vapour, e.g. Nitrogen, CO2, Water

  adsorptive_info:
    aliases: ["_adsorptive_info"]
    description: Alternative or secondary name for the adsorptive, e.g. chemical formula or abbreviation

  adsorptive_inchi:
    aliases: ["_adsorptive_inchi"]
    description: IUPAC InChI identifier of the adsorptive

  adsorptive_cas:
    aliases: ["_adsorptive_cas"]
    description: CAS Registry Number of the adsorptive

  adsorptive_smiles:
    aliases: ["_adsorptive_smiles"]
    description: Canonical SMILES string of the adsorptive

  adsorptive_component_index:
    aliases: ["_adsorptive_component_index"]
    description: Index for the adsorptive component in a mixture
    range: float

  adsorptive_component_name:
    aliases: ["_adsorptive_component_name"]
    description: Name of an adsorptive component in a mixture

  adsorptive_component_info:
    aliases: ["_adsorptive_component_info"]
    description: Additional information about an adsorptive component in a mixture

  adsorptive_component_inchi:
    aliases: ["_adsorptive_component_inchi"]
    description: IUPAC InChI identifier of an adsorptive component in a mixture

  adsorptive_component_cas:
    aliases: ["_adsorptive_component_cas"]
    description: CAS registry Number of an adsorptive component in a mixture

  adsorptive_component_smiles:
    aliases: ["_adsorptive_component_smiles"]
    description: Canonical SMILES of an adsorptive component in a mixture

  # ── Simulation ──────────────────────────────

  simltn_code:
    aliases: ["_simltn_code"]
    description: Name and version of the simulation software, e.g. RASPA 2.0, LAMMPS

  simltn_size:
    aliases: ["_simltn_size"]
    description: Description of the simulated system size, e.g. number of unit cells or particle count

  simltn_forcefield_adsorptive:
    aliases: ["_simltn_forcefield_adsorptive"]
    description: Force field or interaction model used for the adsorptive, e.g. TraPPE, OPLS-AA

  simltn_forcefield_adsorbent:
    aliases: ["_simltn_forcefield_adsorbent"]
    description: Force field or interaction model used for the adsorbent framework, e.g. UFF, DREIDING

  simltn_input_files:
    aliases: ["_simltn_input_files"]
    description: URL or repository link to the simulation input files and scripts

  simltn_sampling:
    aliases: ["_simltn_sampling"]
    description: Phase-space sampling method used, e.g. GCMC, MD, Widom insertion

  simltn_lot:
    aliases: ["_simltn_lot"]
    description: Level of theory for the calculation, e.g. DFT, machine-learned potential, classical force field

  # ── Citation ────────────────────────────────

  citation_doi:
    aliases: ["_citation_doi"]
    description: Digital Object Identifier (DOI) of the publication associated with this data

  citation_source:
    aliases: ["_citation_source"]
    description: Bibliographic source of the data, e.g. journal name, book title, or database

  # ── Units ───────────────────────────────────

  units_temperature:
    aliases: ["_units_temperature"]
    description: Unit of temperature for all temperature values in this file, e.g. K, °C

  units_pressure:
    aliases: ["_units_pressure"]
    description: Unit of pressure for all pressure values in this file, e.g. kPa, bar, mmHg

  units_mass:
    aliases: ["_units_mass"]
    description: Unit of mass for all mass values in this file, e.g. g, mg, kg

  units_loading:
    aliases: ["_units_loading"]
    description: Unit of amount adsorbed for all loading values in this file, e.g. mmol/g, cm3(STP)/g, wt%

  units_density:
    aliases: ["_units_density"]
    description: Unit of density for all density values in this file, e.g. g/cm3, kg/m3

  units_time:
    aliases: ["_units_time"]
    description: Unit of time for all time values in this file, e.g. s, min, hours

  units_molecular_weight:
    aliases: ["_units_molecular_weight"]
    description: Unit of molecular weight values in this file, e.g. g/mol

  units_enthalpy:
    aliases: ["_units_enthalpy"]
    description: Unit of enthalpy values in this file, e.g. kJ/mol

  units_composition_type:
    aliases: ["_units_composition_type"]
    description: Definition of how mixture compositions are expressed, e.g. mole_fraction, mass_fraction

  # ── Adsorption Data ─────────────────────────

  adsorp_index:
    aliases: ["_adsorp_index"]
    description: Index of the adsorption data point, starting from 1 and incrementing by 1 for each point.
    range: float

  adsorp_pressure:
    aliases: ["_adsorp_pressure"]
    description: Equilibrium pressure at each adsorption data point (see _units_pressure)
    range: float

  adsorp_fugacity:
    aliases: ["_adsorp_fugacity"]
    description: Fugacity of the adsorptive at each adsorption data point (see _units_pressure)
    range: float

  adsorp_p0:
    aliases: ["_adsorp_p0"]
    description: Saturation pressure at each adsorption data point, for use in relative pressure calculations (see _units_pressure)
    range: float

  adsorp_loading:
    aliases: ["_adsorp_loading"]
    description: Loading at each adsorption data point (see _units_loading). Total loading in a multicomponent setting.
    range: float

  adsorp_loading_excess:
    aliases: ["_adsorp_loading_excess"]
    description: Excess loading at each adsorption data point (see _units_loading). Total loading in a multicomponent setting.
    range: float

  adsorp_loading_absolute:
    aliases: ["_adsorp_loading_absolute"]
    description: Absolute loading at each adsorption data point (see _units_loading). Total loading in a multicomponent setting.
    range: float

  adsorp_loading_net:
    aliases: ["_adsorp_loading_net"]
    description: Net loading at each adsorption data point (see _units_loading)
    range: float

  adsorp_enthalpy_differential:
    aliases: ["_adsorp_enthalpy_differential"]
    description: Differential enthalpy of adsorption (see _units_enthalpy)
    range: float

  adsorp_enthalpy_integral:
    aliases: ["_adsorp_enthalpy_integral"]
    description: Integral enthalpy of adsorption (see _units_enthalpy)
    range: float

  adsorp_selectivity:
    aliases: ["_adsorp_selectivity"]
    description: Adsorption selectivity for a specified component pair under the given conditions (unitless ratio)
    range: float

  adsorp_composition_component_1:
    aliases: ["_adsorp_composition_component_1"]
    description: Mole fraction of the first component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_2:
    aliases: ["_adsorp_composition_component_2"]
    description: Mole fraction of the second component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_3:
    aliases: ["_adsorp_composition_component_3"]
    description: Mole fraction of the third component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_4:
    aliases: ["_adsorp_composition_component_4"]
    description: Mole fraction of the fourth component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_5:
    aliases: ["_adsorp_composition_component_5"]
    description: Mole fraction of the fifth component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_6:
    aliases: ["_adsorp_composition_component_6"]
    description: Mole fraction of the sixth component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_7:
    aliases: ["_adsorp_composition_component_7"]
    description: Mole fraction of the seventh component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_8:
    aliases: ["_adsorp_composition_component_8"]
    description: Mole fraction of the eighth component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_9:
    aliases: ["_adsorp_composition_component_9"]
    description: Mole fraction of the ninth component in the bulk phase for a multicomponent adsorption measurement (see _units_composition_type)
    range: float

  adsorp_loading_component_1:
    aliases: ["_adsorp_loading_component_1"]
    description: Loading of the first component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_2:
    aliases: ["_adsorp_loading_component_2"]
    description: Loading of the second component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_3:
    aliases: ["_adsorp_loading_component_3"]
    description: Loading of the third component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_4:
    aliases: ["_adsorp_loading_component_4"]
    description: Loading of the fourth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_5:
    aliases: ["_adsorp_loading_component_5"]
    description: Loading of the fifth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_6:
    aliases: ["_adsorp_loading_component_6"]
    description: Loading of the sixth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_7:
    aliases: ["_adsorp_loading_component_7"]
    description: Loading of the seventh component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_8:
    aliases: ["_adsorp_loading_component_8"]
    description: Loading of the eighth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  adsorp_loading_component_9:
    aliases: ["_adsorp_loading_component_9"]
    description: Loading of the ninth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_loading)
    range: float

  # ── Desorption Data ─────────────────────────

  desorp_index:
    aliases: ["_desorp_index"]
    description: Index of the desorption data point, starting from 1 and incrementing by 1 for each point.
    range: float

  desorp_pressure:
    aliases: ["_desorp_pressure"]
    description: Equilibrium pressure at each desorption data point (see _units_pressure)
    range: float

  desorp_fugacity:
    aliases: ["_desorp_fugacity"]
    description: Fugacity of the adsorptive at each desorption data point (see _units_pressure)
    range: float

  desorp_p0:
    aliases: ["_desorp_p0"]
    description: Saturation pressure at each desorption data point, for use in relative pressure calculations (see _units_pressure)
    range: float

  desorp_loading:
    aliases: ["_desorp_loading"]
    description: Loading remaining adsorbed at each desorption data point (see _units_loading)
    range: float

  desorp_loading_excess:
    aliases: ["_desorp_loading_excess"]
    description: Excess loading remaining adsorbed at each desorption data point (see _units_loading)
    range: float

  desorp_loading_absolute:
    aliases: ["_desorp_loading_absolute"]
    description: Absolute loading remaining adsorbed at each desorption data point (see _units_loading)
    range: float

  desorp_loading_net:
    aliases: ["_desorp_loading_net"]
    description: Net loading remaining adsorbed at each desorption data point (see _units_loading)
    range: float

  desorp_enthalpy_differential:
    aliases: ["_desorp_enthalpy_differential"]
    description: Differential enthalpy of desorption (see _units_enthalpy)
    range: float

  desorp_enthalpy_integral:
    aliases: ["_desorp_enthalpy_integral"]
    description: Integral enthalpy of desorption (see _units_enthalpy)
    range: float

  desorp_molefraction:
    aliases: ["_desorp_molefraction"]
    description: Mole fraction of the adsorptive in the gas phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_selectivity:
    aliases: ["_desorp_selectivity"]
    description: Desorption selectivity for a specified component pair under the given conditions (unitless ratio)
    range: float

  desorp_composition_component_1:
    aliases: ["_desorp_composition_component_1"]
    description: Mole fraction of the first component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_2:
    aliases: ["_desorp_composition_component_2"]
    description: Mole fraction of the second component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_3:
    aliases: ["_desorp_composition_component_3"]
    description: Mole fraction of the third component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_4:
    aliases: ["_desorp_composition_component_4"]
    description: Mole fraction of the fourth component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_5:
    aliases: ["_desorp_composition_component_5"]
    description: Mole fraction of the fifth component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_6:
    aliases: ["_desorp_composition_component_6"]
    description: Mole fraction of the sixth component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_7:
    aliases: ["_desorp_composition_component_7"]
    description: Mole fraction of the seventh component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_8:
    aliases: ["_desorp_composition_component_8"]
    description: Mole fraction of the eighth component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_9:
    aliases: ["_desorp_composition_component_9"]
    description: Mole fraction of the ninth component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_loading_component_1:
    aliases: ["_desorp_loading_component_1"]
    description: Loading of the first component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_2:
    aliases: ["_desorp_loading_component_2"]
    description: Loading of the second component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_3:
    aliases: ["_desorp_loading_component_3"]
    description: Loading of the third component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_4:
    aliases: ["_desorp_loading_component_4"]
    description: Loading of the fourth component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_5:
    aliases: ["_desorp_loading_component_5"]
    description: Loading of the fifth component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_6:
    aliases: ["_desorp_loading_component_6"]
    description: Loading of the sixth component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_7:
    aliases: ["_desorp_loading_component_7"]
    description: Loading of the seventh component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_8:
    aliases: ["_desorp_loading_component_8"]
    description: Loading of the eighth component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

  desorp_loading_component_9:
    aliases: ["_desorp_loading_component_9"]
    description: Loading of the ninth component in the adsorbed phase for a multicomponent desorption measurement (see _units_loading)
    range: float

# ──────────────────────────────────────────────
#  Classes
# ──────────────────────────────────────────────

classes:

  AdsorptionDataPoint:
    description: >-
      A single data point in the adsorption branch of an isotherm.
      Corresponds to a row in an AIF loop_ block for adsorption.
    slots:
      - adsorp_index
      - adsorp_pressure
      - adsorp_fugacity
      - adsorp_p0
      - adsorp_loading
      - adsorp_loading_excess
      - adsorp_loading_absolute
      - adsorp_loading_net
      - adsorp_enthalpy_differential
      - adsorp_enthalpy_integral
      - adsorp_selectivity
      - adsorp_composition_component_1
      - adsorp_composition_component_2
      - adsorp_composition_component_3
      - adsorp_composition_component_4
      - adsorp_composition_component_5
      - adsorp_composition_component_6
      - adsorp_composition_component_7
      - adsorp_composition_component_8
      - adsorp_composition_component_9
      - adsorp_loading_component_1
      - adsorp_loading_component_2
      - adsorp_loading_component_3
      - adsorp_loading_component_4
      - adsorp_loading_component_5
      - adsorp_loading_component_6
      - adsorp_loading_component_7
      - adsorp_loading_component_8
      - adsorp_loading_component_9

  DesorptionDataPoint:
    description: >-
      A single data point in the desorption branch of an isotherm.
      Corresponds to a row in an AIF loop_ block for desorption.
    slots:
      - desorp_index
      - desorp_pressure
      - desorp_fugacity
      - desorp_p0
      - desorp_loading
      - desorp_loading_excess
      - desorp_loading_absolute
      - desorp_loading_net
      - desorp_enthalpy_differential
      - desorp_enthalpy_integral
      - desorp_molefraction
      - desorp_selectivity
      - desorp_composition_component_1
      - desorp_composition_component_2
      - desorp_composition_component_3
      - desorp_composition_component_4
      - desorp_composition_component_5
      - desorp_composition_component_6
      - desorp_composition_component_7
      - desorp_composition_component_8
      - desorp_composition_component_9
      - desorp_loading_component_1
      - desorp_loading_component_2
      - desorp_loading_component_3
      - desorp_loading_component_4
      - desorp_loading_component_5
      - desorp_loading_component_6
      - desorp_loading_component_7
      - desorp_loading_component_8
      - desorp_loading_component_9

  AdsorptionInformationFile:
    description: >-
      Root class representing a complete AIF data block. Contains
      metadata about the experiment or simulation, units, citation
      information, and the adsorption/desorption data points.
    tree_root: true
    slots:
      # Audit
      - audit_aif_version
      - audit_creation_date
      - audit_creation_software
      - audit_digitizer
      # Experimental
      - exptl_operator
      - exptl_date
      - exptl_instrument
      - exptl_temperature
      - exptl_method
      - exptl_isotherm_type
      # Adsorbent
      - adsnt_material_id
      - adsnt_info
      - adsnt_sample_id
      - adsnt_hashkey
      - adsnt_structure_csd_refcode
      - adsnt_structure_topology
      - adsnt_structure_smiles
      - adsnt_composition
      - adsnt_molar_mass
      - adsnt_synthesis
      - adsnt_sample_mass
      - adsnt_sample_density
      - adsnt_degas_summary
      - adsnt_degas_temperature
      - adsnt_degas_time
      # Adsorptive
      - adsorptive_name
      - adsorptive_info
      - adsorptive_inchi
      - adsorptive_cas
      - adsorptive_smiles
      - adsorptive_component_index
      - adsorptive_component_name
      - adsorptive_component_info
      - adsorptive_component_inchi
      - adsorptive_component_cas
      - adsorptive_component_smiles
      # Simulation
      - simltn_code
      - simltn_size
      - simltn_forcefield_adsorptive
      - simltn_forcefield_adsorbent
      - simltn_input_files
      - simltn_sampling
      - simltn_lot
      # Citation
      - citation_doi
      - citation_source
      # Units
      - units_temperature
      - units_pressure
      - units_mass
      - units_loading
      - units_density
      - units_time
      - units_molecular_weight
      - units_enthalpy
      - units_composition_type
    attributes:
      adsorption_data:
        description: Adsorption branch data points (loop_ block).
        range: AdsorptionDataPoint
        multivalued: true
