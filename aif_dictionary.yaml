  AdsorptionInformationFile:
    description: >-
      Root class representing a complete AIF data block. Contains
      metadata about the experiment or simulation, units, citation
      information, and the adsorption/desorption data points.
    tree_root: true
    slots:
      # Audit
      - audit_aif_version
      - audit_author
      - audit_creation_date
      - audit_creation_method
      - audit_creation_software
      # Experimental
      - exptl_operator
      - exptl_date
      - exptl_instrument
      - exptl_temperature
      - exptl_method
      - exptl_isotherm_type
      # Adsorbent
      - adsnt_material_name
      - adsnt_info
      - adsnt_sample_name
      - adsnt_hashkey
      - adsnt_structure_csd_refcode
      - adsnt_structure_topology
      - adsnt_structure_smiles
      - adsnt_composition
      - adsnt_molar_mass
      - adsnt_synthesis
      - adsnt_sample_mass
      - adsnt_sample_density
      - adsnt_degas_summary
      - adsnt_degas_temperature
      - adsnt_degas_time
      # Adsorptive
      - adsorptive_name
      - adsorptive_info
      - adsorptive_inchi
      - adsorptive_cas
      - adsorptive_smiles
      - adsorptive_formula
      - adsorptive_component_index
      - adsorptive_component_name
      - adsorptive_component_info
      - adsorptive_component_inchi
      - adsorptive_component_cas
      - adsorptive_component_smiles
      - adsorptive_component_formula
      # Simulation
      - simltn_code
      - simltn_size
      - simltn_forcefield_adsorptive
      - simltn_forcefield_adsorbent
      - simltn_input_files
      - simltn_sampling
      - simltn_lot
      - simltn_date
      # Digitization
      - digitization_author
      - digitization_date
      - digitization_method
      - digitization_software
      - digitization_notes
      # Citation
      - citation_doi
      - citation_source
      - citation_figure
      - citation_page
      - citation_url
      # Units
      - units_temperature
      - units_pressure
      - units_mass
      - units_sorbed_amount
      - units_density
      - units_time
      - units_molecular_weight
      - units_enthalpy
      - units_composition_type
      - units_concentration
    attributes:
      adsorption_data:
        description: Adsorption branch data points (loop_ block).
        range: AdsorptionDataPoint
        multivalued: true
        inlined_as_list: true
      desorption_data:
        description: Desorption branch data points (loop_ block).
        range: DesorptionDataPoint
        multivalued: true
        inlined_as_list: true
