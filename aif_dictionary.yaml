    range: float

  adsorp_amount_component_10:
    aliases: ["_adsorp_amount_component_10"]
    description: Sorptive loading of the tenth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  # ── Desorption Data ─────────────────────────

  desorp_index:
    aliases: ["_desorp_index"]
    description: "Index of the desorption data point, starting from 1 and incrementing by 1 for each point."
    range: float

  desorp_pressure:
    aliases: ["_desorp_pressure"]
    description: Equilibrium pressure at each desorption data point (see _units_pressure)
    range: float

  desorp_fugacity:
    aliases: ["_desorp_fugacity"]
    description: Fugacity of the adsorptive at each desorption data point (see _units_pressure)
    range: float

  desorp_p0:
    aliases: ["_desorp_p0"]
    description: "Saturation pressure at each desorption data point, for use in relative pressure calculations (see _units_pressure)"
    range: float

  desorp_amount:
    aliases: ["_desorp_amount"]
    description: Loading remaining adsorbed at each desorption data point (see _units_sorbed_amount)
    range: float

  desorp_amount_excess:
    aliases: ["_desorp_amount_excess"]
    description: Excess loading remaining adsorbed at each desorption data point (see _units_sorbed_amount)
