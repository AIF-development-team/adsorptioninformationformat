    range: float

  adsorp_composition_component_9:
    aliases: ["_adsorp_composition_component_9"]
    description: Mole fraction of the ninth component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_10:
    aliases: ["_adsorp_composition_component_10"]
    description: Mole fraction of the tenth component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_amount_component_1:
    aliases: ["_adsorp_amount_component_1"]
    description: Sorptive loading of the first component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_2:
    aliases: ["_adsorp_amount_component_2"]
    description: Sorptive loading of the second component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_3:
    aliases: ["_adsorp_amount_component_3"]
    description: Sorptive loading of the third component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_4:
    aliases: ["_adsorp_amount_component_4"]
    description: Sorptive loading of the fourth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_5:
    aliases: ["_adsorp_amount_component_5"]
    description: Sorptive loading of the fifth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_6:
    aliases: ["_adsorp_amount_component_6"]
    description: Sorptive loading of the sixth component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_7:
    aliases: ["_adsorp_amount_component_7"]
    description: Sorptive loading of the seventh component in the adsorbed phase for a multicomponent adsorption measurement (see _units_sorbed_amount)
    range: float

  adsorp_amount_component_8:
