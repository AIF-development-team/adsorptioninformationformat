id: https://github.com/AIF-development-team/adsorptioninformationformat
name: aif
title: Adsorption Information Format (AIF)
description: >-
  Dictionary for STAR format adsorption experiment and simulation data
  files Reference: Evans et al., Langmuir 2021, 37, 4222-4226.
version: "__AIF_VERSION__"
license: MIT

prefixes:
  aif: https://github.com/AIF-development-team/adsorptioninformationformat/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  qudt: http://qudt.org/schema/qudt/

imports:
  - linkml:types

default_range: string

# ──────────────────────────────────────────────
#  Enumerations
# ──────────────────────────────────────────────

enums:

  ExperimentalMethod:
    description: Method used to determine amount adsorbed.
    permissible_values:
      volumetric:
        description: Volumetric (manometric) method.
      gravimetric:
        description: Gravimetric method.
      chromatographic:
        description: Chromatographic method.
      simulation:
        description: Computational simulation method.
      other:
        description: Other method not listed.
  IsothermType:
    description: Type of adsorption isotherm.
    permissible_values:
      absolute:
        description: Absolute adsorption.
      excess:
        description: Excess adsorption.
      net:
        description: Net adsorption.
  DigitizationMethod:
    description: Method of data extraction from a source figure.
    permissible_values:
      human:
        description: Data extracted solely by a human. This does not exclude the use of software tools but indicates that data selection decisions were made exclusively by a human person.
      AI-aided:
        description: "Data extracted in part using machine learning or AI tools, in cooperation with or verified by a human person."
      AI-automated:
        description: "Data extracted automatically from a figure via machine learning or AI tools, without human intervention."

# ──────────────────────────────────────────────
#  Slots (data items / fields)
# ──────────────────────────────────────────────

slots:

  # ── Audit ───────────────────────────────────

  audit_aif_version:
    aliases: ["_audit_aif_version"]
    description: Version of the AIF data-name dictionary used by this file
    required: true

  audit_author:
    aliases: ["_audit_author"]
    description: "Name of the person who created the data block, if different from the experiment operator."

  audit_creation_date:
    aliases: ["_audit_creation_date"]
    description: Date and time the AIF file was created in ISO 8601 format
    range: datetime

  audit_creation_method:
    aliases: ["_audit_creation_method"]
    description: "The method by which the AIF file was created, e.g. 'manual', 'scripted', 'exported', etc."

  audit_creation_software:
    aliases: ["_audit_creation_software"]
    description: Name and version of the software used to generate this AIF file

  # ── Experimental ────────────────────────────

  exptl_operator:
    aliases: ["_exptl_operator"]
    description: Name of the person who performed the experiment or ran the simulation.

  exptl_date:
    aliases: ["_exptl_date"]
    description: Date and time of the experiment in ISO 8601 format
    range: datetime

  exptl_instrument:
    aliases: ["_exptl_instrument"]
    description: Identifier or model name of the instrument used for the measurement

  exptl_temperature:
    aliases: ["_exptl_temperature"]
    description: Temperature at which the experiment was conducted (see _units_temperature)
    range: float

  exptl_method:
    aliases: ["_exptl_method"]
    description: Experimental technique used to measure the amount adsorbed
    required: true
    range: ExperimentalMethod

  exptl_isotherm_type:
    aliases: ["_exptl_isotherm_type"]
    description: Classification of the reported adsorbed amount
    range: IsothermType

  # ── Adsorbent ───────────────────────────────

  adsnt_material_name:
    aliases: ["_adsnt_material_name"]
    description: "Name or designation of the adsorbent material, e.g. UiO-66, Zeolite-13X"
    required: true

  adsnt_info:
    aliases: ["_adsnt_info"]
    description: Free-text field for additional information about the adsorbent sample

  adsnt_sample_name:
    aliases: ["_adsnt_sample_name"]
    description: Unique sample identifier assigned by the operator or laboratory

  adsnt_hashkey:
    aliases: ["_adsnt_hashkey"]
    description: Machine-readable hash key for programmatic identification of the adsorbent

  adsnt_structure_csd_refcode:
    aliases: ["_adsnt_structure_csd_refcode"]
    description: Cambridge Structural Database (CSD) reference code for the adsorbent structure

  adsnt_structure_topology:
    aliases: ["_adsnt_structure_topology"]
    description: Network topology descriptor (e.g. RCSR symbol) for the adsorbent

  adsnt_structure_smiles:
    aliases: ["_adsnt_structure_smiles"]
    description: SMILES of the organic linker or building block of the adsorbent

  adsnt_composition:
    aliases: ["_adsnt_composition"]
    description: "Chemical composition or formula of the adsorbent, e.g. Cu3(BTC)2"

  adsnt_molar_mass:
    aliases: ["_adsnt_molar_mass"]
    description: Molar mass of the adsorbent formula unit (see _units_molecular_weight)
    range: float

  adsnt_synthesis:
    aliases: ["_adsnt_synthesis"]
    description: "Synthesis route or details used, e.g. solvothermal, mechanochemical, reference to MPIF, etc"

  adsnt_sample_mass:
    aliases: ["_adsnt_sample_mass"]
    description: Mass of the adsorbent sample used in the measurement (see _units_mass)
    range: float

  adsnt_sample_density:
    aliases: ["_adsnt_sample_density"]
    description: Bulk or skeletal density of the adsorbent sample (see _units_density)
    range: float

  adsnt_degas_summary:
    aliases: ["_adsnt_degas_summary"]
    description: Human-readable summary of the degassing procedure and conditions

  adsnt_degas_temperature:
    aliases: ["_adsnt_degas_temperature"]
    description: Temperature at which the sample was degassed prior to measurement (see _units_temperature)
    range: float

  adsnt_degas_time:
    aliases: ["_adsnt_degas_time"]
    description: Duration of the degassing step (see _units_time)
    range: float

  # ── Adsorptive ──────────────────────────────

  adsorptive_name:
    aliases: ["_adsorptive_name"]
    description: "Common name of the adsorptive gas or vapour, e.g. Nitrogen, CO2, Water"

  adsorptive_info:
    aliases: ["_adsorptive_info"]
    description: "Alternative or secondary name for the adsorptive, e.g. chemical formula or abbreviation"

  adsorptive_inchi:
    aliases: ["_adsorptive_inchi"]
    description: IUPAC InChI identifier of the adsorptive

  adsorptive_cas:
    aliases: ["_adsorptive_cas"]
    description: CAS Registry Number of the adsorptive

  adsorptive_smiles:
    aliases: ["_adsorptive_smiles"]
    description: Canonical SMILES string of the adsorptive

  adsorptive_formula:
    aliases: ["_adsorptive_formula"]
    description: Chemical formula of the adsorptive

  adsorptive_component_index:
    aliases: ["_adsorptive_component_index"]
    description: Index for an adsorptive component in a mixture
    range: integer

  adsorptive_component_name:
    aliases: ["_adsorptive_component_name"]
    description: "Common name of an adsorptive component in a mixture, e.g. Nitrogen, CO2, Water"

  adsorptive_component_info:
    aliases: ["_adsorptive_component_info"]
    description: "Alternative or secondary name for an adsorptive component in a mixture, e.g. chemical formula or abbreviation"

  adsorptive_component_inchi:
    aliases: ["_adsorptive_component_inchi"]
    description: IUPAC InChI identifier of an adsorptive component in a mixture

  adsorptive_component_cas:
    aliases: ["_adsorptive_component_cas"]
    description: CAS Registry Number of an adsorptive component in a mixture

  adsorptive_component_smiles:
    aliases: ["_adsorptive_component_smiles"]
    description: Canonical SMILES string of an adsorptive component in a mixture

  adsorptive_component_formula:
    aliases: ["_adsorptive_component_formula"]
    description: Chemical formula of an adsorptive component in a mixture

  # ── Simulation ──────────────────────────────

  simltn_code:
    aliases: ["_simltn_code"]
    description: "Name and version of the simulation software, e.g. RASPA 2.0, LAMMPS"

  simltn_size:
    aliases: ["_simltn_size"]
    description: "Description of the simulated system size, e.g. number of unit cells or particle count"

  simltn_forcefield_adsorptive:
    aliases: ["_simltn_forcefield_adsorptive"]
    description: "Force field or interaction model used for the adsorptive, e.g. TraPPE, OPLS-AA"

  simltn_forcefield_adsorbent:
    aliases: ["_simltn_forcefield_adsorbent"]
    description: "Force field or interaction model used for the adsorbent framework, e.g. UFF, DREIDING"

  simltn_input_files:
    aliases: ["_simltn_input_files"]
    description: URL or repository link to the simulation input files and scripts

  simltn_sampling:
    aliases: ["_simltn_sampling"]
    description: "Phase-space sampling method used, e.g. GCMC, MD, Widom insertion"

  simltn_lot:
    aliases: ["_simltn_lot"]
    description: "Level of theory for the calculation, e.g. DFT, machine-learned potential, classical force field"

  simltn_date:
    aliases: ["_simltn_date"]
    description: Date and time of the simulation in ISO 8601 format. This field is deprecated and may be removed in future versions of the AIF schema.
    range: datetime
    deprecated: true

  # ── Digitization ────────────────────────────

  digitization_author:
    aliases: ["_digitization_author"]
    description: Name of the person who digitized the data from the published figure or table

  digitization_date:
    aliases: ["_digitization_date"]
    description: Date when the data were digitized from the published figure or table
    range: datetime

  digitization_method:
    aliases: ["_digitization_method"]
    description: "The decision making method in validating the data: solely by a human (human), with ML/AI assistance or AI with human review (AI-aided), or fully automated via ML/AI without human intervention (AI-automated)."
    range: DigitizationMethod

  digitization_software:
    aliases: ["_digitization_software"]
    description: "Name and version of the software or tool used to digitize the data, e.g. WebPlotDigitizer 4.6, Engauge Digitizer, or 'manual' for pixel-by-pixel manual measurement. This field must be present when _digitization_method is either AI-aided or AI-automated."

  digitization_notes:
    aliases: ["_digitization_notes"]
    description: "Free-text field for any additional notes about the digitization process or source, like assumptions, limitations, data identification (e.g. which curve was digitized), or any other relevant information."

  # ── Citation ────────────────────────────────

  citation_doi:
    aliases: ["_citation_doi"]
    description: Digital Object Identifier (DOI) of the publication associated with this data

  citation_source:
    aliases: ["_citation_source"]
    description: "Bibliographic source or full citation of the data, e.g. journal name, book title, or database"

  citation_figure:
    aliases: ["_citation_figure"]
    description: "Identifier of the figure or table within the original publication, e.g. Figure 3b, Table S2"

  citation_page:
    aliases: ["_citation_page"]
    description: "Page number or supplementary-information identifier of the original publication, e.g. 145, S12"

  citation_url:
    aliases: ["_citation_url"]
    description: "URL or persistent link to the source of the publication, data, figure or table, if available."

  # ── Units ───────────────────────────────────

  units_temperature:
    aliases: ["_units_temperature"]
    description: "Unit of temperature for all temperature values in this file, e.g. K, °C"

  units_pressure:
    aliases: ["_units_pressure"]
    description: "Unit of pressure for all pressure values in this file, e.g. kPa, bar, mmHg"

  units_mass:
    aliases: ["_units_mass"]
    description: "Unit of mass for all mass values in this file, e.g. g, mg, kg"

  units_sorbed_amount:
    aliases: ["_units_sorbed_amount"]
    description: "Unit of amount adsorbed for all loading values in this file, e.g. mmol/g, cm3(STP)/g, wt%"

  units_density:
    aliases: ["_units_density"]
    description: "Unit of density for all density values in this file, e.g. g/cm3, kg/m3"

  units_time:
    aliases: ["_units_time"]
    description: "Unit of time for all time values in this file, e.g. s, min, hours"

  units_molecular_weight:
    aliases: ["_units_molecular_weight"]
    description: "Unit of molecular weight values in this file, e.g. g/mol"

  units_enthalpy:
    aliases: ["_units_enthalpy"]
    description: "Unit of enthalpy values in this file, e.g. kJ/mol"

  units_composition_type:
    aliases: ["_units_composition_type"]
    description: "Definition of how mixture compositions are expressed, e.g. mole_fraction, mass_fraction, partial_pressure, relative_humidity, concentration"

  units_concentration:
    aliases: ["_units_concentration"]
    description: Unit of concentration. Requires _units_composition_type = concentration

  # ── Adsorption Data ─────────────────────────

  adsorp_index:
    aliases: ["_adsorp_index"]
    description: "Index of the adsorption data point, starting from 1 and incrementing by 1 for each point."
    range: float

  adsorp_pressure:
    aliases: ["_adsorp_pressure"]
    description: Equilibrium pressure at each adsorption data point (see _units_pressure)
    range: float

  adsorp_fugacity:
    aliases: ["_adsorp_fugacity"]
    description: Fugacity of the adsorptive at each adsorption data point (see _units_pressure)
    range: float

  adsorp_p0:
    aliases: ["_adsorp_p0"]
    description: "Saturation pressure at each adsorption data point, for use in relative pressure calculations (see _units_pressure)"
    range: float

  adsorp_amount:
    aliases: ["_adsorp_amount"]
    description: Loading at each adsorption data point (see _units_sorbed_amount). Key is used as total loading in a multicomponent setting.
    range: float

  adsorp_amount_excess:
    aliases: ["_adsorp_amount_excess"]
    description: Excess loading at each adsorption data point (see _units_sorbed_amount). Key is used as total loading in a multicomponent setting.
    range: float

  adsorp_amount_absolute:
    aliases: ["_adsorp_amount_absolute"]
    description: Absolute loading at each adsorption data point (see _units_sorbed_amount). Key is used as total loading in a multicomponent setting.
    range: float

  adsorp_amount_net:
    aliases: ["_adsorp_amount_net"]
    description: Net loading at each adsorption data point (see _units_sorbed_amount)
    range: float

  adsorp_enthalpy_differential:
    aliases: ["_adsorp_enthalpy_differential"]
    description: Differential enthalpy of adsorption (see _units_enthalpy)
    range: float

  adsorp_enthalpy_integral:
    aliases: ["_adsorp_enthalpy_integral"]
    description: Integral enthalpy of adsorption (see _units_enthalpy)
    range: float

  adsorp_fugacity_component_1:
    aliases: ["_adsorp_fugacity_component_1"]
    description: Fugacity of first adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_2:
    aliases: ["_adsorp_fugacity_component_2"]
    description: Fugacity of second adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_3:
    aliases: ["_adsorp_fugacity_component_3"]
    description: Fugacity of third adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_4:
    aliases: ["_adsorp_fugacity_component_4"]
    description: Fugacity of fourth adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_5:
    aliases: ["_adsorp_fugacity_component_5"]
    description: Fugacity of fifth adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_6:
    aliases: ["_adsorp_fugacity_component_6"]
    description: Fugacity of sixth adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_7:
    aliases: ["_adsorp_fugacity_component_7"]
    description: Fugacity of seventh adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_8:
    aliases: ["_adsorp_fugacity_component_8"]
    description: Fugacity of eighth adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_9:
    aliases: ["_adsorp_fugacity_component_9"]
    description: Fugacity of ninth adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_fugacity_component_10:
    aliases: ["_adsorp_fugacity_component_10"]
    description: Fugacity of tenth adsorptive component in the bulk phase at each adsorption measurement (see _units_pressure)
    range: float

  adsorp_composition_component_1:
    aliases: ["_adsorp_composition_component_1"]
    description: Mole fraction of the first component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_2:
    aliases: ["_adsorp_composition_component_2"]
    description: Mole fraction of the second component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_3:
    aliases: ["_adsorp_composition_component_3"]
    description: Mole fraction of the third component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_4:
    aliases: ["_adsorp_composition_component_4"]
    description: Mole fraction of the fourth component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_5:
    aliases: ["_adsorp_composition_component_5"]
    description: Mole fraction of the fifth component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_6:
    aliases: ["_adsorp_composition_component_6"]
    description: Mole fraction of the sixth component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_7:
    aliases: ["_adsorp_composition_component_7"]
    description: Mole fraction of the seventh component in the bulk phase at each adsorption measurement (see _units_composition_type)
    range: float

  adsorp_composition_component_8:
    aliases: ["_adsorp_composition_component_8"]
