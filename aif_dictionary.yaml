    range: float

  desorp_fugacity_component_5:
    aliases: ["_desorp_fugacity_component_5"]
    description: Fugacity of fifth adsorptive component in the bulk phase at each desorption measurement (see _units_pressure)
    range: float

  desorp_fugacity_component_6:
    aliases: ["_desorp_fugacity_component_6"]
    description: Fugacity of sixth adsorptive component in the bulk phase at each desorption measurement (see _units_pressure)
    range: float

  desorp_fugacity_component_7:
    aliases: ["_desorp_fugacity_component_7"]
    description: Fugacity of seventh adsorptive component in the bulk phase at each desorption measurement (see _units_pressure)
    range: float

  desorp_fugacity_component_8:
    aliases: ["_desorp_fugacity_component_8"]
    description: Fugacity of eighth adsorptive component in the bulk phase at each desorption measurement (see _units_pressure)
    range: float

  desorp_fugacity_component_9:
    aliases: ["_desorp_fugacity_component_9"]
    description: Fugacity of ninth adsorptive component in the bulk phase at each desorption measurement (see _units_pressure)
    range: float

  desorp_fugacity_component_10:
    aliases: ["_desorp_fugacity_component_10"]
    description: Fugacity of tenth adsorptive component in the bulk phase at each desorption measurement (see _units_pressure)
    range: float

  desorp_composition_component_1:
    aliases: ["_desorp_composition_component_1"]
    description: Mole fraction of the first component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_2:
    aliases: ["_desorp_composition_component_2"]
    description: Mole fraction of the second component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_3:
    aliases: ["_desorp_composition_component_3"]
    description: Mole fraction of the third component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

  desorp_composition_component_4:
    aliases: ["_desorp_composition_component_4"]
    description: Mole fraction of the fourth component in the bulk phase for a multicomponent desorption measurement (see _units_composition_type)
    range: float

