# pre-commit configuration for the AIF repository
# This file defines hooks that run automatically when `git commit`
# is executed. The goal is to catch common mistakes in the core
# dictionary files before they are ever pushed to the remote.

repos:
  # use the standard set of community-maintained hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # ensure the JSON dictionary is syntactically valid
      - id: check-json
        files: aif_dictionary\.json$
      # ensure the YAML dictionary (if present) is valid
      - id: check-yaml
        files: aif_dictionary\.yaml$

  # local hooks allow us to run custom project-specific scripts
  - repo: local
    hooks:
      - id: check-aif-version
        name: Check AIF version consistency
        # this script inspects all three dictionary formats and
        # verifies version fields are identical and semver-compliant
        entry: python dev/check_aif_format.py
        language: python
        # trigger on any of the dictionary files (json, dic, yaml)
        files: aif_dictionary\.(json|dic|yaml)$
        # our script handles filenames itself, so don't pass them
        pass_filenames: false
