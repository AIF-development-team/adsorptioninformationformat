name: Update AIF Version

on:
  push:
    tags:
      - '*'

jobs:
  new_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version bump
        run: |
          # Get the previous tag (the one before the current tag)
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || echo "")
          if [ -n "$previous_tag" ]; then
            python dev/update_version.py --version "$current_tag" --previous "$previous_tag"
          else
            echo "No previous tag found — skipping version comparison."
          fi

      - name: Generate Changelog
        id: changelog
        run: |
          previous_tag=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$previous_tag" ]; then
            changelog=$(git log "$previous_tag"..HEAD --pretty=format:"- %s")
          else
            changelog=$(git log --pretty=format:"- %s")
          fi
          echo "changelog=$changelog" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ env.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
