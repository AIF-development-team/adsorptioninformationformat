name: Update AIF Version

on:
  push:
    tags:
      - '*'

jobs:
  new_release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate JSON syntax
        run: python -m json.tool aif_dictionary.json > /dev/null

      - name: Check version consistency across all dictionaries
        run: python dev/check_aif_format.py

      - name: Check YAML/DIC are in sync with JSON schema
        run: python dev/sync_dictionaries.py --check

      - name: Validate version bump
        run: |
          # Get the previous tag (the one before the current tag)
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || echo "")
          if [ -n "$previous_tag" ]; then
            python dev/update_version.py --check --version "$current_tag" --previous "$previous_tag"
          else
            echo "No previous tag found — skipping version comparison."
          fi

      - name: Generate Changelog
        id: changelog
        run: |
          current_tag="${{ github.ref_name }}"
          previous_tag=$(git tag --sort=-v:refname | grep -v "^${current_tag}$" | head -n 1 || echo "")
          if [ -n "$previous_tag" ]; then
            changelog=$(git log "$previous_tag"..HEAD --pretty=format:"- %s")
          else
            changelog=$(git log --pretty=format:"- %s")
          fi
          {
            echo 'changelog<<EOF'
            echo "$changelog"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
