name: Update AIF Version

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  # Full validation (sync, tests, strict version check) of the tagged commit.
  validate:
    uses: ./.github/workflows/validate.yml
    with:
      release-tag: ${{ github.ref_name }}

  new_release:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Validate version bump
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Prerelease tags (X.Y.Z-suffix) sort before their release.
          previous_tag=$(git -c versionsort.suffix=- tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | grep -vxF "$RELEASE_TAG" | head -n 1 || echo "")
          if [ -n "$previous_tag" ]; then
            python dev/update_version.py --check --version "$RELEASE_TAG" --previous "$previous_tag"
          else
            echo "No previous tag found — skipping version comparison."
          fi

      - name: Generate Changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          previous_tag=$(git -c versionsort.suffix=- tag --sort=-v:refname | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' | grep -vxF "$RELEASE_TAG" | head -n 1 || echo "")
          if [ -n "$previous_tag" ]; then
            changelog=$(git log "$previous_tag"..HEAD --pretty=format:"- %s")
          else
            changelog=$(git log --pretty=format:"- %s")
          fi
          {
            echo 'changelog<<EOF'
            echo "$changelog"
            echo 'EOF'
          } >> $GITHUB_ENV

      - name: Detect prerelease
        id: kind
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A '-' after X.Y.Z (e.g. v1.0.0-beta.1) marks a prerelease.
          if [[ "$RELEASE_TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: ${{ env.changelog }}
          draft: false
          prerelease: ${{ steps.kind.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
